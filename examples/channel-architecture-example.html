<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Channel diagram example — AI agent triage architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* MiSans via @import inside <style> — self_check.py approves only
     fonts.googleapis.com/css2 as a remote stylesheet link; <style> text
     is CSS, not an element attribute, so it is never URL-checked. */
  @import url('https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Medium.min.css');
  @import url('https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Semibold.min.css');
  @import url('https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Bold.min.css');

  /* No background on html/body — omit_background export requires the page
     not to paint behind the SVG; keep the PNG transparent for slide compositing. */
  html, body { margin: 0; padding: 0; }
  svg text { font-family: 'Inter', sans-serif; }
  svg .ms { font-family: 'MiSans', sans-serif; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="chan-arch-title chan-arch-desc">
  <title id="chan-arch-title">AI agent triage architecture</title>
  <desc id="chan-arch-desc">Slide-deck architecture diagram in the channel skin: three viewer questions enter a triage agent, which routes them to an editor agent or a claims agent; a guardrail checks the agents, and verified work lands in the video script.</desc>

  <defs>
    <marker id="chan-arrow-muted" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5C5A75"/>
    </marker>
    <marker id="chan-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6D5DF6"/>
    </marker>
  </defs>

  <!-- paper: transparent — PNG composites onto the slide card (white or tint) without a halo -->

  <!-- eyebrows (MiSans 630, 0.18em tracking, uppercase, accent) -->
  <text class="ms" x="160" y="160" text-anchor="middle" font-size="8" font-weight="630" letter-spacing="1.44" fill="#6D5DF6">VIEWER QUESTIONS</text>
  <text class="ms" x="504" y="160" text-anchor="middle" font-size="8" font-weight="630" letter-spacing="1.44" fill="#6D5DF6">TRIAGE</text>
  <text class="ms" x="856" y="160" text-anchor="middle" font-size="8" font-weight="630" letter-spacing="1.44" fill="#6D5DF6">AGENTS</text>
  <text class="ms" x="1136" y="160" text-anchor="middle" font-size="8" font-weight="630" letter-spacing="1.44" fill="#6D5DF6">OUTPUT</text>

  <!-- inputs: muted @ 0.10 fill, soft stroke -->
  <g>
    <rect x="64" y="192" width="192" height="64" rx="6" fill="#5C5A75" fill-opacity="0.10" stroke="#A3A0BC" stroke-width="1"/>
    <text x="160" y="228" text-anchor="middle" font-size="16" font-weight="600" fill="#19172E">Works in Canada?</text>
    <text class="ms" x="160" y="246" text-anchor="middle" font-size="12" font-weight="380" fill="#5C5A75">viewer question</text>
  </g>
  <g>
    <rect x="64" y="288" width="192" height="64" rx="6" fill="#5C5A75" fill-opacity="0.10" stroke="#A3A0BC" stroke-width="1"/>
    <text x="160" y="324" text-anchor="middle" font-size="16" font-weight="600" fill="#19172E">Real app audio?</text>
    <text class="ms" x="160" y="342" text-anchor="middle" font-size="12" font-weight="380" fill="#5C5A75">viewer question</text>
  </g>
  <g>
    <rect x="64" y="384" width="192" height="64" rx="6" fill="#5C5A75" fill-opacity="0.10" stroke="#A3A0BC" stroke-width="1"/>
    <text x="160" y="420" text-anchor="middle" font-size="16" font-weight="600" fill="#19172E">Free tier limits?</text>
    <text class="ms" x="160" y="438" text-anchor="middle" font-size="12" font-weight="380" fill="#5C5A75">viewer question</text>
  </g>

  <!-- classifier: backend (white fill, ink stroke) -->
  <g>
    <rect x="400" y="272" width="208" height="96" rx="6" fill="#FFFFFF" stroke="#19172E" stroke-width="1"/>
    <text x="504" y="316" text-anchor="middle" font-size="16" font-weight="600" fill="#19172E">Triage agent</text>
    <text class="ms" x="504" y="336" text-anchor="middle" font-size="12" font-weight="380" fill="#5C5A75">intent + risk</text>
  </g>

  <!-- agents: backend -->
  <g>
    <rect x="752" y="224" width="208" height="80" rx="6" fill="#FFFFFF" stroke="#19172E" stroke-width="1"/>
    <text x="856" y="258" text-anchor="middle" font-size="16" font-weight="600" fill="#19172E">Editor agent</text>
    <text class="ms" x="856" y="278" text-anchor="middle" font-size="12" font-weight="380" fill="#5C5A75">cuts + b-roll</text>
  </g>
  <g>
    <rect x="752" y="344" width="208" height="80" rx="6" fill="#FFFFFF" stroke="#19172E" stroke-width="1"/>
    <text x="856" y="378" text-anchor="middle" font-size="16" font-weight="600" fill="#19172E">Claims agent</text>
    <text class="ms" x="856" y="398" text-anchor="middle" font-size="12" font-weight="380" fill="#5C5A75">verifies numbers</text>
  </g>

  <!-- guardrail: security (accent @0.05 fill, accent @0.50 dashed 4,4) -->
  <g>
    <rect x="752" y="480" width="208" height="64" rx="6" fill="#6D5DF6" fill-opacity="0.05" stroke="#6D5DF6" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="856" y="508" text-anchor="middle" font-size="16" font-weight="600" fill="#19172E">Guardrail</text>
    <text class="ms" x="856" y="526" text-anchor="middle" font-size="12" font-weight="380" fill="#5C5A75">policy check</text>
  </g>

  <!-- focal: video script (accent-tint fill, accent stroke) -->
  <g>
    <rect x="1056" y="272" width="160" height="96" rx="6" fill="#6D5DF6" fill-opacity="0.08" stroke="#6D5DF6" stroke-width="1.2"/>
    <text x="1136" y="316" text-anchor="middle" font-size="16" font-weight="600" fill="#19172E">Video script</text>
    <text class="ms" x="1136" y="336" text-anchor="middle" font-size="12" font-weight="380" fill="#5C5A75">the final cut</text>
  </g>

  <!-- connectors: muted, 1px, elbows with 8px corners -->
  <path d="M 256 224 H 320 Q 328 224 328 232 V 312 Q 328 320 336 320 H 392" fill="none" stroke="#5C5A75" stroke-width="1" marker-end="url(#chan-arrow-muted)"/>
  <path d="M 256 320 H 392" fill="none" stroke="#5C5A75" stroke-width="1" marker-end="url(#chan-arrow-muted)"/>
  <path d="M 256 416 H 320 Q 328 416 328 408 V 328 Q 328 320 336 320 H 392" fill="none" stroke="#5C5A75" stroke-width="1" marker-end="url(#chan-arrow-muted)"/>
  <path d="M 608 320 H 664 Q 672 320 672 312 V 272 Q 672 264 680 264 H 744" fill="none" stroke="#5C5A75" stroke-width="1" marker-end="url(#chan-arrow-muted)"/>
  <path d="M 608 320 H 664 Q 672 320 672 328 V 376 Q 672 384 680 384 H 744" fill="none" stroke="#5C5A75" stroke-width="1" marker-end="url(#chan-arrow-muted)"/>
  <path d="M 960 264 H 1000 Q 1008 264 1008 272 V 312 Q 1008 320 1016 320 H 1048" fill="none" stroke="#5C5A75" stroke-width="1" marker-end="url(#chan-arrow-muted)"/>
  <path d="M 960 384 H 1000 Q 1008 384 1008 376 V 328 Q 1008 320 1016 320 H 1048" fill="none" stroke="#5C5A75" stroke-width="1" marker-end="url(#chan-arrow-muted)"/>

  <!-- guardrail watches the agents: dashed accent, upward -->
  <path d="M 856 480 V 428" fill="none" stroke="#6D5DF6" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#chan-arrow-accent)"/>

  <!-- arrow labels (MiSans 380, 0.06em tracking, muted) -->
  <text class="ms" x="680" y="248" text-anchor="middle" font-size="12" font-weight="380" letter-spacing="0.72" fill="#5C5A75">route by intent</text>
  <text class="ms" x="1008" y="248" text-anchor="middle" font-size="12" font-weight="380" letter-spacing="0.72" fill="#5C5A75">verified drafts</text>

  <!-- legend strip: bottom 60px, nothing else lives here -->
  <g>
    <rect x="64" y="680" width="12" height="12" rx="2" fill="#6D5DF6" fill-opacity="0.08" stroke="#6D5DF6" stroke-width="1"/>
    <text class="ms" x="84" y="692" font-size="12" font-weight="380" fill="#5C5A75">focal</text>
    <rect x="200" y="680" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#19172E" stroke-width="1"/>
    <text class="ms" x="220" y="692" font-size="12" font-weight="380" fill="#5C5A75">service</text>
    <rect x="336" y="680" width="12" height="12" rx="2" fill="#5C5A75" fill-opacity="0.10" stroke="#A3A0BC" stroke-width="1"/>
    <text class="ms" x="356" y="692" font-size="12" font-weight="380" fill="#5C5A75">input</text>
    <rect x="460" y="680" width="12" height="12" rx="2" fill="#6D5DF6" fill-opacity="0.05" stroke="#6D5DF6" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,4"/>
    <text class="ms" x="480" y="692" font-size="12" font-weight="380" fill="#5C5A75">guardrail</text>
  </g>
</svg>
</body>
</html>
